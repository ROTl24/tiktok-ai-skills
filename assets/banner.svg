<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="TikTok UGC Ad Maker — turn a product photo into a shoot-ready UGC ad plan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1018"/>
      <stop offset="55%" stop-color="#111725"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5470" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF5470" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5470"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>
  <rect width="1280" height="380" fill="url(#grid)"/>
  <ellipse cx="1010" cy="120" rx="330" ry="240" fill="url(#glowA)"/>
  <ellipse cx="1210" cy="330" rx="300" ry="220" fill="url(#glowB)"/>

  <!-- logo mark: aperture / play triangle in a rounded frame -->
  <g transform="translate(72,74)">
    <rect x="0" y="0" width="46" height="46" rx="13" fill="none" stroke="#FF5470" stroke-width="2.4"/>
    <path d="M18 14.5 L33 23 L18 31.5 Z" fill="#2DD4BF"/>
  </g>
  <text x="132" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3.4" fill="#8C97AC">AGENT&#160;SKILL&#160;&#183;&#160;v1.1.0</text>

  <text x="72" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#F4F6FA" letter-spacing="-1.4">TikTok UGC Ad Maker</text>

  <text x="72" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#AEB9CC">Turn a product photo into a shoot-ready UGC ad plan.</text>
  <text x="72" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#7E8AA0">一张产品图 · 分镜 · 口播 · B-roll · 视频提示词 · 合规检查</text>

  <rect x="72" y="300" width="132" height="4" rx="2" fill="url(#rule)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#94A0B4">
    <text x="72" y="341">storyboard-first</text>
    <text x="222" y="341" fill="#4A5568">|</text>
    <text x="244" y="341">compliance-routed</text>
    <text x="404" y="341" fill="#4A5568">|</text>
    <text x="426" y="341">no fabricated claims</text>
  </g>

  <!-- illustration: three 9:16 storyboard frames feeding a gate -->
  <g transform="translate(772,58)">
    <g opacity="0.5">
      <rect x="0" y="46" width="96" height="171" rx="12" fill="#151C2B" stroke="url(#cardEdge)" stroke-width="1.2"/>
      <rect x="14" y="62" width="68" height="46" rx="6" fill="#FF5470" fill-opacity="0.18"/>
      <rect x="14" y="120" width="68" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.16"/>
      <rect x="14" y="134" width="48" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="14" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5C6880">S-01</text>
    </g>
    <g opacity="0.75">
      <rect x="112" y="30" width="96" height="171" rx="12" fill="#161E2E" stroke="url(#cardEdge)" stroke-width="1.2"/>
      <rect x="126" y="46" width="68" height="46" rx="6" fill="#A855F7" fill-opacity="0.20"/>
      <rect x="126" y="104" width="68" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.18"/>
      <rect x="126" y="118" width="52" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.13"/>
      <text x="126" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6B7890">S-02</text>
    </g>
    <g>
      <rect x="224" y="14" width="96" height="171" rx="12" fill="#18202F" stroke="#2DD4BF" stroke-opacity="0.42" stroke-width="1.4"/>
      <rect x="238" y="30" width="68" height="46" rx="6" fill="#2DD4BF" fill-opacity="0.22"/>
      <rect x="238" y="88" width="68" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.22"/>
      <rect x="238" y="102" width="56" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.16"/>
      <text x="238" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#2DD4BF">S-03</text>
    </g>

    <!-- derived outputs -->
    <g transform="translate(348,52)">
      <path d="M-28 78 H-14 M-14 46 H30 M-14 78 H30 M-14 110 H30 M-14 46 V110" fill="none" stroke="#3B475C" stroke-width="1.3"/>
      <circle cx="-28" cy="78" r="3" fill="#2DD4BF"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9AA6BA">
        <rect x="34" y="34" width="94" height="24" rx="6" fill="#141B29" stroke="#293347"/>
        <text x="45" y="50">script</text>
        <rect x="34" y="66" width="94" height="24" rx="6" fill="#141B29" stroke="#293347"/>
        <text x="45" y="82">b-roll</text>
        <rect x="34" y="98" width="94" height="24" rx="6" fill="#141B29" stroke="#293347"/>
        <text x="45" y="114">prompts</text>
      </g>
    </g>
  </g>
</svg>
