<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" width="1180" height="340" role="img" aria-label="Compliance coverage depth by market: US TikTok deepest, China Douyin baseline, other markets generic">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1018"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <pattern id="cgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1180" height="340" fill="url(#cbg)"/>
  <rect width="1180" height="340" fill="url(#cgrid)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="40" y="46" font-size="17" font-weight="600" fill="#E4E9F1">合规覆盖深度</text>
    <text x="168" y="46" font-size="14" fill="#7B8699">深度不对称是写明的，不假装全都很懂</text>

    <!-- US -->
    <g>
      <rect x="40" y="72" width="340" height="228" rx="14" fill="#141B29" stroke="#2DD4BF" stroke-opacity="0.42" stroke-width="1.5"/>
      <text x="66" y="108" font-size="16" font-weight="600" fill="#E4E9F1">US TikTok</text>
      <text x="66" y="132" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2DD4BF">DEEPEST</text>
      <rect x="66" y="146" width="288" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect x="66" y="146" width="288" height="6" rx="3" fill="#2DD4BF"/>
      <g font-size="13.5" fill="#A9B4C6">
        <text x="66" y="186">美妆 / 护肤宣称边界</text>
        <text x="66" y="212">FTC 披露规则</text>
        <text x="66" y="238">FDA 化妆品宣称限制</text>
        <text x="66" y="264">达人与 AI 达人披露</text>
      </g>
    </g>

    <!-- CN -->
    <g>
      <rect x="420" y="72" width="340" height="228" rx="14" fill="#141B29" stroke="#A855F7" stroke-opacity="0.38" stroke-width="1.5"/>
      <text x="446" y="108" font-size="16" font-weight="600" fill="#E4E9F1">中国抖音</text>
      <text x="446" y="132" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#A855F7">BASELINE</text>
      <rect x="446" y="146" width="288" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect x="446" y="146" width="158" height="6" rx="3" fill="#A855F7"/>
      <g font-size="13.5" fill="#A9B4C6">
        <text x="446" y="186">广告法绝对化用语</text>
        <text x="446" y="212">品类规则</text>
        <text x="446" y="238">价格与促销表述</text>
        <text x="446" y="264">AIGC 标识</text>
      </g>
    </g>

    <!-- Other -->
    <g>
      <rect x="800" y="72" width="340" height="228" rx="14" fill="#141B29" stroke="#293347" stroke-width="1.5"/>
      <text x="826" y="108" font-size="16" font-weight="600" fill="#E4E9F1">其他市场</text>
      <text x="826" y="132" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7B8699">GENERIC</text>
      <rect x="826" y="146" width="288" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect x="826" y="146" width="76" height="6" rx="3" fill="#5A6880"/>
      <g font-size="13.5" fill="#A9B4C6">
        <text x="826" y="186">通用披露与素材规则</text>
        <text x="826" y="212">明确提示核对当地政策</text>
      </g>
      <g font-size="12.5" fill="#77839A">
        <text x="826" y="252">合规文档头部标注</text>
        <text x="826" y="272">最后核对日期</text>
      </g>
    </g>
  </g>
</svg>
